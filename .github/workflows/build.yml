name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 --legacy-peer-deps
        npm install @capacitor/android@5.7.0 --legacy-peer-deps
        npm install -g sharp-cli
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Рулетка Майнкрафт" "com.mycompany.rouletteminecraft" --web-dir=www
        npx cap add android
    
    - name: Copy files to www
      run: |
        mkdir -p www
        cp index.html www/
    
    - name: Add icon to Android project
      run: |
        # Создаем все папки для иконок
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        mkdir -p android/app/src/main/res/drawable
        
        # Если есть icon.png - создаем все размеры
        if [ -f "icon.png" ]; then
          echo "✅ Иконка найдена, создаем размеры..."
          
          # Создаем все размеры с помощью sharp
          npx sharp-cli -i icon.png -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png resize 48 48
          npx sharp-cli -i icon.png -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png resize 72 72
          npx sharp-cli -i icon.png -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png resize 96 96
          npx sharp-cli -i icon.png -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png resize 144 144
          npx sharp-cli -i icon.png -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png resize 192 192
          
          # Копируем оригинал
          cp icon.png android/app/src/main/res/drawable/icon.png
          
          # Создаем ic_launcher.png в drawable
          cp icon.png android/app/src/main/res/drawable/ic_launcher.png
          
          echo "✅ Иконки созданы"
        elif [ -f "resources/icon.png" ]; then
          echo "✅ Иконка найдена в resources, создаем размеры..."
          
          npx sharp-cli -i resources/icon.png -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png resize 48 48
          npx sharp-cli -i resources/icon.png -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png resize 72 72
          npx sharp-cli -i resources/icon.png -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png resize 96 96
          npx sharp-cli -i resources/icon.png -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png resize 144 144
          npx sharp-cli -i resources/icon.png -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png resize 192 192
          
          cp resources/icon.png android/app/src/main/res/drawable/icon.png
          cp resources/icon.png android/app/src/main/res/drawable/ic_launcher.png
          
          echo "✅ Иконки созданы"
        else
          echo "⚠️ Иконка не найдена"
        fi
    
    - name: Update AndroidManifest.xml
      run: |
        # Обновляем манифест для использования нашей иконки
        sed -i 's/android:icon="@mipmap/ic_launcher"/android:icon="@mipmap/ic_launcher"/g' android/app/src/main/AndroidManifest.xml
        echo "✅ Манифест обновлен"
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Roulette-Minecraft-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
