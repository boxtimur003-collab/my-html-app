name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 --legacy-peer-deps
        npm install @capacitor/android@5.7.0 --legacy-peer-deps
        npm install -g cordova-res sharp-cli
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Мое Крутое Приложение" "com.mycompany.myapp" --web-dir=www
        npx cap add android
    
    - name: Copy files to www
      run: |
        mkdir -p www
        cp index.html www/
        cp -r css www/ 2>/dev/null || true
        cp -r js www/ 2>/dev/null || true
        cp -r images www/ 2>/dev/null || true
    
    - name: Generate icons manually
      run: |
        if [ -f "resources/icon.png" ]; then
          echo "✅ Иконка найдена, генерируем все размеры..."
          
          # Создаем все размеры иконок вручную
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Генерируем разные размеры
          npx sharp -i resources/icon.png -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png resize 48 48
          npx sharp -i resources/icon.png -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png resize 72 72
          npx sharp -i resources/icon.png -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png resize 96 96
          npx sharp -i resources/icon.png -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png resize 144 144
          npx sharp -i resources/icon.png -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png resize 192 192
          
          # Копируем также в drawable
          mkdir -p android/app/src/main/res/drawable
          cp resources/icon.png android/app/src/main/res/drawable/icon.png
          
          echo "✅ Иконки созданы успешно"
        else
          echo "⚠️ Иконка не найдена, используется стандартная"
        fi
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
