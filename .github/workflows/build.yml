name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 --legacy-peer-deps
        npm install @capacitor/android@5.7.0 --legacy-peer-deps
        pip install Pillow
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Рулетка Майнкрафт" "com.mycompany.rouletteminecraft" --web-dir=www
        npx cap add android
    
    - name: Copy files to www
      run: |
        mkdir -p www
        cp index.html www/
    
    - name: Add icon using Python
      run: |
        # Создаем все папки для иконок
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        mkdir -p android/app/src/main/res/drawable
        
        # Создаем скрипт для конвертации иконки
        cat > convert_icon.py << 'EOF'
        from PIL import Image
        import os
        
        # Ищем иконку в разных местах
        icon_paths = ['icon.png', 'resources/icon.png', 'resources/icon.jpg', 'icon.jpg']
        icon_path = None
        
        for path in icon_paths:
            if os.path.exists(path):
                icon_path = path
                break
        
        if icon_path:
            print(f"✅ Найдена иконка: {icon_path}")
            img = Image.open(icon_path)
            img = img.convert('RGBA')
            
            # Создаем все размеры
            sizes = {
                'mdpi': 48,
                'hdpi': 72,
                'xhdpi': 96,
                'xxhdpi': 144,
                'xxxhdpi': 192
            }
            
            for folder, size in sizes.items():
                resized = img.resize((size, size), Image.LANCZOS)
                output_path = f'android/app/src/main/res/mipmap-{folder}/ic_launcher.png'
                resized.save(output_path, 'PNG')
                print(f"✅ Создана иконка {folder}: {size}x{size}")
            
            # Копируем оригинал
            img.save('android/app/src/main/res/drawable/icon.png', 'PNG')
            img.save('android/app/src/main/res/drawable/ic_launcher.png', 'PNG')
            print("✅ Все иконки успешно созданы!")
        else:
            print("⚠️ Иконка не найдена, используется стандартная")
        EOF
        
        python convert_icon.py
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Roulette-Minecraft-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
