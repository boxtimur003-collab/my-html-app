name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 --legacy-peer-deps
        npm install @capacitor/android@5.7.0 --legacy-peer-deps
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Рулетка Майнкрафт" "com.mycompany.rouletteminecraft" --web-dir=www
        npx cap add android
    
    - name: Copy files to www
      run: |
        mkdir -p www
        cp index.html www/
        cp -r css www/ 2>/dev/null || true
        cp -r js www/ 2>/dev/null || true
        cp -r images www/ 2>/dev/null || true
    
    - name: Sync Capacitor
      run: |
        npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Roulette-Minecraft-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
